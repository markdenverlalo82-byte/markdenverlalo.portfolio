<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Toto Villaruel | Fine Art & Editorial Photography</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Alpine.js for Reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen bg-[#FAFAFA] text-[#1A1A1A] antialiased selection:bg-[#9E8873] selection:text-white"
      x-data="photographyApp()" x-init="init()">

    <!-- Header Nav -->
    <header class="sticky top-0 z-40 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-stone-200/80 px-6 py-6 md:px-12 transition-all">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <button @click="selectedAlbum = null; activeTab = 'portfolio'" class="text-left group cursor-pointer">
                <h1 class="text-2xl md:text-3xl tracking-widest font-light uppercase text-stone-900 group-hover:text-[#9E8873] transition-colors">
                    TOTO VILLARUEL
                </h1>
                <p class="text-[10px] tracking-[0.3em] uppercase text-stone-400 font-sans mt-0.5">
                    Fine Art & Editorial Photography
                </p>
            </button>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-6 md:gap-10 text-xs tracking-[0.2em] font-sans uppercase">
                <button @click="selectedAlbum = null; activeTab = 'portfolio'" 
                        :class="activeTab === 'portfolio' && !selectedAlbum ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Albums
                </button>
                <button @click="selectedAlbum = null; activeTab = 'stories'" 
                        :class="activeTab === 'stories' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Featured Stories
                </button>
                <button @click="selectedAlbum = null; activeTab = 'about'" 
                        :class="activeTab === 'about' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    About
                </button>
                <button @click="selectedAlbum = null; activeTab = 'contact'" 
                        :class="activeTab === 'contact' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Contact
                </button>
                <button @click="selectedAlbum = null; activeTab = 'admin'" 
                        :class="activeTab === 'admin' ? 'bg-[#9E8873] text-white font-semibold border-[#9E8873]' : 'text-stone-600 hover:text-stone-900 border-stone-300'" 
                        class="px-3 py-1.5 rounded-full border flex items-center gap-1.5 text-[10px] transition-all hover:border-[#9E8873]">
                    <i data-lucide="lock" x-show="!isAdminAuthenticated" class="w-3 h-3"></i>
                    <i data-lucide="unlock" x-show="isAdminAuthenticated" class="w-3 h-3"></i>
                    <span>Admin Portal</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-6 md:px-12 py-12">
        
        <!-- SINGLE ALBUM VIEW -->
        <template x-if="selectedAlbum">
            <div class="space-y-12 max-w-5xl mx-auto">
                <button @click="selectedAlbum = null" class="flex items-center gap-2 text-xs font-sans tracking-[0.2em] uppercase text-stone-500 hover:text-[#9E8873] transition-colors cursor-pointer">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back to All Albums</span>
                </button>

                <div class="space-y-4 border-b border-stone-200 pb-10">
                    <span class="text-xs font-sans tracking-[0.3em] uppercase text-[#9E8873] font-medium" x-text="selectedAlbum.category + (selectedAlbum.location ? ' — ' + selectedAlbum.location : '')"></span>
                    <h1 class="text-3xl md:text-5xl font-serif text-stone-900 font-light" x-text="selectedAlbum.title"></h1>
                    <p class="text-lg font-serif italic text-stone-500" x-show="selectedAlbum.subtitle" x-text="selectedAlbum.subtitle"></p>
                    <p class="text-stone-700 font-serif leading-relaxed text-base max-w-3xl pt-2" x-show="selectedAlbum.description" x-text="selectedAlbum.description"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
                    <template x-for="(photo, idx) in selectedAlbum.photos">
                        <div @click="openLightbox(idx)" class="group relative cursor-pointer overflow-hidden bg-stone-100 border border-stone-200/80 shadow-sm hover:shadow-md transition-all">
                            <div class="aspect-[4/5] overflow-hidden">
                                <img :src="photo.url" :alt="photo.caption" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
                            </div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-6 flex flex-col justify-end">
                                <span class="text-xs font-sans text-stone-100" x-text="photo.caption || 'Photo ' + (idx + 1)"></span>
                                <span class="text-[10px] font-sans text-[#EBE3D9] uppercase tracking-wider mt-1 flex items-center gap-1">
                                    <i data-lucide="maximize-2" class="w-3 h-3"></i> View Fullscreen
                                </span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

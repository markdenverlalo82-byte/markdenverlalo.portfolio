<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MARK DENVER LALO | Wedding & Documentary Photography</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Alpine.js for Reactivity -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,300;0,400;0,500;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap');
        body {
            font-family: 'Playfair Display', serif;
        }
        .font-sans {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
</head>
<body class="min-h-screen bg-[#FAFAFA] text-[#1A1A1A] antialiased selection:bg-[#9E8873] selection:text-white"
      x-data="photographyApp()" x-init="init()">

    <!-- Header Nav -->
    <header class="sticky top-0 z-40 bg-[#FAFAFA]/90 backdrop-blur-md border-b border-stone-200/80 px-6 py-6 md:px-12 transition-all">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <button @click="selectedAlbum = null; activeTab = 'stories'" class="text-left group cursor-pointer">
                <h1 class="text-2xl md:text-3xl tracking-widest font-light uppercase text-stone-900 group-hover:text-[#9E8873] transition-colors">
                    MARK DENVER LALO
                </h1>
                <p class="text-[10px] tracking-[0.3em] uppercase text-stone-400 font-sans mt-0.5">
                    Wedding & Documentary Photography
                </p>
            </button>

            <!-- Navigation Links -->
            <nav class="flex items-center gap-6 md:gap-10 text-xs tracking-[0.2em] font-sans uppercase">
                <button @click="selectedAlbum = null; activeTab = 'stories'" 
                        :class="activeTab === 'stories' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Featured Stories
                </button>
                <button @click="selectedAlbum = null; activeTab = 'portfolio'" 
                        :class="activeTab === 'portfolio' && !selectedAlbum ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Albums
                </button>
                <button @click="selectedAlbum = null; activeTab = 'about'" 
                        :class="activeTab === 'about' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    About
                </button>
                <button @click="selectedAlbum = null; activeTab = 'contact'" 
                        :class="activeTab === 'contact' ? 'text-[#9E8873] border-b border-[#9E8873] font-medium' : 'text-stone-500 hover:text-stone-900'" class="pb-1 transition-all">
                    Contact
                </button>
                <button @click="selectedAlbum = null; activeTab = 'admin'" 
                        :class="activeTab === 'admin' ? 'bg-[#9E8873] text-white font-semibold border-[#9E8873]' : 'text-stone-600 hover:text-stone-900 border-stone-300'" 
                        class="px-3 py-1.5 rounded-full border flex items-center gap-1.5 text-[10px] transition-all hover:border-[#9E8873]">
                    <i data-lucide="lock" x-show="!isAdminAuthenticated" class="w-3 h-3"></i>
                    <i data-lucide="unlock" x-show="isAdminAuthenticated" class="w-3 h-3"></i>
                    <span>Admin Portal</span>
                </button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="max-w-7xl mx-auto px-6 md:px-12 py-12">
        
        <!-- SINGLE ALBUM VIEW -->
        <template x-if="selectedAlbum">
            <div class="space-y-12 max-w-5xl mx-auto">
                <button @click="selectedAlbum = null" class="flex items-center gap-2 text-xs font-sans tracking-[0.2em] uppercase text-stone-500 hover:text-[#9E8873] transition-colors cursor-pointer">
                    <i data-lucide="arrow-left" class="w-4 h-4"></i>
                    <span>Back</span>
                </button>

                <div class="space-y-4 border-b border-stone-200 pb-10">
                    <span class="text-xs font-sans tracking-[0.3em] uppercase text-[#9E8873] font-medium" x-text="selectedAlbum.category + (selectedAlbum.location ? ' — ' + selectedAlbum.location : '')"></span>
                    <h1 class="text-3xl md:text-5xl font-serif text-stone-900 font-light" x-text="selectedAlbum.title"></h1>
                    <p class="text-lg font-serif italic text-stone-500" x-show="selectedAlbum.subtitle" x-text="selectedAlbum.subtitle"></p>
                    <p class="text-stone-700 font-serif leading-relaxed text-base max-w-3xl pt-2" x-show="selectedAlbum.description" x-text="selectedAlbum.description"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-8 md:gap-12">
                    <template x-for="(photo, idx) in selectedAlbum.photos">
                        <div @click="openLightbox(idx)" class="group relative cursor-pointer overflow-hidden bg-stone-100 border border-stone-200/80 shadow-sm hover:shadow-md transition-all">
                            <div class="aspect-[4/5] overflow-hidden">
                                <img :src="photo.url" :alt="photo.caption" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105">
                            </div>
                            <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity p-6 flex flex-col justify-end">
                                <span class="text-xs font-sans text-stone-100" x-text="photo.caption || 'Photo ' + (idx + 1)"></span>
                                <span class="text-[10px] font-sans text-[#EBE3D9] uppercase tracking-wider mt-1 flex items-center gap-1">
                                    <i data-lucide="maximize-2" class="w-3 h-3"></i> View Fullscreen
                                </span>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- MAIN TABS -->
        <template x-if="!selectedAlbum">
          <div>
            <!-- TAB 1: FEATURED STORIES (Homepage Default) -->
            <div x-show="activeTab === 'stories'" class="space-y-16 max-w-5xl mx-auto">
                <div class="text-center space-y-3">
                    <h2 class="text-3xl md:text-4xl font-serif tracking-wide text-stone-900 font-light">Featured Love Stories</h2>
                    <p class="text-xs font-sans uppercase tracking-[0.2em] text-stone-500">Full photo essays and intimate celebrations</p>
                </div>

                <div class="space-y-20">
                    <template x-for="(story, i) in albums.filter(a => a.featured && a.visible)">
                        <div @click="selectedAlbum = story" class="cursor-pointer group grid grid-cols-1 lg:grid-cols-12 gap-8 items-center bg-white border border-stone-200/80 p-6 md:p-8 shadow-sm hover:shadow-md transition-all">
                            <div :class="i % 2 === 1 ? 'lg:order-2 lg:col-span-7' : 'lg:order-1 lg:col-span-7'">
                                <div class="aspect-[3/2] overflow-hidden bg-stone-100 border border-stone-200">
                                    <img :src="story.coverUrl" :alt="story.title" class="w-full h-full object-cover group-hover:scale-105 transition-all duration-700">
                                </div>
                            </div>
                            <div :class="i % 2 === 1 ? 'lg:order-1 lg:col-span-5' : 'lg:order-2 lg:col-span-5'" class="space-y-4">
                                <span class="text-xs font-sans tracking-[0.25em] text-[#9E8873] uppercase font-medium block" x-text="story.category + ' — Story ' + (i+1)"></span>
                                <h3 class="text-2xl md:text-3xl font-serif text-stone-900 group-hover:text-[#9E8873] transition-colors" x-text="story.title"></h3>
                                <p class="text-stone-600 font-serif text-sm leading-relaxed" x-text="story.description"></p>
                                <div class="pt-2 flex items-center text-xs font-sans text-[#9E8873] font-medium gap-2">
                                    <span x-text="'Explore Story (' + story.photos.length + ' Photographs)'"></span>
                                    <i data-lucide="arrow-right" class="w-4 h-4 group-hover:translate-x-1 transition-transform"></i>
                                </div>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 2: PORTFOLIO GALLERY -->
            <div x-show="activeTab === 'portfolio'" class="space-y-12">
                <div class="text-center max-w-2xl mx-auto space-y-4 py-4">
                    <p class="text-stone-600 italic font-serif text-lg md:text-xl leading-relaxed">
                        "Capturing quiet, honest stories bathed in warm natural light and timeless elegance."
                    </p>
                    <div class="w-12 h-[1px] bg-[#9E8873]/40 mx-auto"></div>
                </div>

                <!-- Category Filters -->
                <div class="flex flex-wrap justify-center gap-6 text-xs font-sans tracking-[0.2em] uppercase py-2">
                    <template x-for="cat in categories">
                        <button @click="selectedCategory = cat" 
                                :class="selectedCategory === cat ? 'text-[#9E8873] font-semibold border-b border-[#9E8873]' : 'text-stone-400 hover:text-stone-800'"
                                class="transition-colors cursor-pointer pb-1" x-text="cat"></button>
                    </template>
                </div>

                <!-- Albums Grid -->
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 md:gap-12">
                    <template x-for="album in visibleAlbums" :key="album.id">
                        <div @click="selectedAlbum = album" class="group relative cursor-pointer overflow-hidden bg-white border border-stone-200/80 shadow-sm hover:shadow-md transition-all">
                            <div class="aspect-[4/5] overflow-hidden bg-stone-100">
                                <img :src="album.coverUrl || album.photos[0]?.url" :alt="album.title" class="w-full h-full object-cover transition-transform duration-700 ease-out group-hover:scale-105" loading="lazy">
                            </div>
                            <div class="p-6 bg-white border-t border-stone-100">
                                <div class="flex justify-between items-center text-[10px] tracking-[0.2em] font-sans uppercase text-[#9E8873] mb-1 font-medium">
                                    <span x-text="album.category"></span>
                                    <span class="flex items-center gap-1 text-stone-400">
                                        <i data-lucide="layers" class="w-3 h-3"></i> <span x-text="album.photos.length"></span> photos
                                    </span>
                                </div>
                                <h3 class="text-xl font-serif text-stone-900 tracking-wide font-light group-hover:text-[#9E8873] transition-colors" x-text="album.title"></h3>
                                <p class="text-xs font-serif italic text-stone-500 mt-0.5" x-show="album.subtitle" x-text="album.subtitle"></p>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- TAB 3: ABOUT -->
            <div x-show="activeTab === 'about'" class="max-w-4xl mx-auto space-y-16 py-6">
                <div class="grid grid-cols-1 md:grid-cols-12 gap-12 items-center">
                    <div class="md:col-span-5">
                        <div class="aspect-[4/5] bg-stone-100 border border-stone-300 relative shadow-md">
                            <img src="MRK06063.jpg" alt="Mark Denver Lalo" class="w-full h-full object-cover">
                        </div>
                    </div>
                    <div class="md:col-span-7 space-y-6">
                        <span class="text-xs font-sans tracking-[0.3em] text-[#9E8873] font-medium uppercase block">The Artist</span>
                        <h2 class="text-3xl md:text-4xl font-serif text-stone-900 font-light">Mark Denver Lalo</h2>
                        <div class="space-y-4 text-stone-600 font-serif leading-relaxed text-base">
                            <p>I am a wedding and portrait photographer devoted to capturing quiet beauty, genuine emotion, and warm, cinematic tones.</p>
                            <p>With an aesthetic rooted in editorial storytelling and classic film warmth, my goal is to create imagery that feels timeless, atmospheric, and profoundly human.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- TAB 4: CONTACT -->
            <div x-show="activeTab === 'contact'" class="max-w-2xl mx-auto space-y-8 py-6">
                <div class="text-center space-y-3">
                    <span class="text-xs font-sans tracking-[0.3em] text-[#9E8873] font-medium uppercase block">Inquiries & Booking</span>
                    <h2 class="text-3xl md:text-4xl font-serif text-stone-900 font-light">Let's Create Together</h2>
                </div>
                <form @submit.prevent="alert('Thank you for reaching out! We will get back to you within 24 hours.')" class="space-y-6 bg-white p-8 border border-stone-200/80 shadow-sm font-sans">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="space-y-2">
                            <label class="text-[11px] tracking-widest text-stone-500 uppercase">First Name</label>
                            <input required type="text" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                        </div>
                        <div class="space-y-2">
                            <label class="text-[11px] tracking-widest text-stone-500 uppercase">Last Name</label>
                            <input required type="text" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                        </div>
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] tracking-widest text-stone-500 uppercase">Email Address</label>
                        <input required type="email" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                    </div>
                    <div class="space-y-2">
                        <label class="text-[11px] tracking-widest text-stone-500 uppercase">Message & Vision</label>
                        <textarea rows="4" required class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]"></textarea>
                    </div>
                    <button type="submit" class="w-full bg-[#9E8873] text-white py-4 font-sans text-xs tracking-[0.25em] uppercase font-semibold hover:bg-[#887360] transition-colors shadow-sm">Send Inquiry</button>
                </form>
            </div>

            <!-- TAB 5: ADMIN PORTAL -->
            <div x-show="activeTab === 'admin'" class="max-w-6xl mx-auto space-y-12">
                <!-- PIN Login -->
                <template x-if="!isAdminAuthenticated">
                    <div class="max-w-md mx-auto py-16 text-center space-y-6 bg-white border border-stone-200/80 p-8 shadow-sm">
                        <div class="w-12 h-12 bg-stone-100 rounded-full flex items-center justify-center mx-auto text-[#9E8873]">
                            <i data-lucide="lock" class="w-6 h-6"></i>
                        </div>
                        <div class="space-y-2">
                            <h2 class="text-2xl font-serif text-stone-900">Admin Dashboard</h2>
                            <p class="text-xs font-sans text-stone-500">Enter passcode to access album & photo management</p>
                        </div>
                        <form @submit.prevent="handlePinSubmit" class="space-y-4">
                            <input type="password" placeholder="Enter PIN (Default: 1234)" x-model="pinInput" class="w-full bg-stone-50 border border-stone-200 p-3 text-center text-lg text-stone-900 font-mono tracking-widest focus:outline-none focus:border-[#9E8873]">
                            <p class="text-xs text-rose-500 font-sans" x-show="pinError">Invalid PIN code. Try "1234"</p>
                            <button type="submit" class="w-full bg-[#9E8873] text-white py-3 font-sans text-xs tracking-[0.2em] uppercase font-semibold hover:bg-[#887360] transition-colors">Unlock Admin Access</button>
                        </form>
                    </div>
                </template>

                <!-- Admin Dashboard (Authenticated) -->
                <template x-if="isAdminAuthenticated">
                    <div class="space-y-12">
                        <div class="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-stone-200 pb-6 gap-4">
                            <div>
                                <h2 class="text-2xl font-serif text-stone-900">Multi-Photo Album Manager</h2>
                                <p class="text-xs font-sans text-stone-500 mt-1">Create stories, perform multi-photo batch uploads, and assign main covers.</p>
                            </div>
                            <button @click="handleLogoutAdmin" class="px-4 py-2 border border-stone-300 text-stone-600 hover:text-stone-900 text-xs font-sans uppercase tracking-wider transition-colors">Lock Portal</button>
                        </div>

                        <!-- Album Form -->
                        <div class="bg-white border border-stone-200/80 p-6 md:p-8 space-y-6 shadow-sm">
                            <div class="flex items-center gap-2 text-[#9E8873] font-sans text-xs uppercase tracking-widest font-semibold">
                                <i data-lucide="folder-plus" class="w-4 h-4"></i>
                                <span x-text="editingAlbumId ? 'Edit Album Details & Photos' : 'Create New Multi-Photo Album'"></span>
                            </div>

                            <form @submit.prevent="handleSaveAlbum" class="space-y-6 font-sans">
                                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Album Title *</label>
                                        <input required type="text" x-model="albumForm.title" placeholder="e.g. Tuscany Sunset Prenup" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Subtitle / Tagline</label>
                                        <input type="text" x-model="albumForm.subtitle" placeholder="e.g. Intimate Vows at Villa Catenignano" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                                    </div>
                                </div>

                                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                                    <div class="space-y-2">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Category *</label>
                                        <select x-model="albumForm.category" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                                            <template x-for="cat in categories.filter(c => c !== 'All')">
                                                <option :value="cat" x-text="cat"></option>
                                            </template>
                                        </select>
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Location</label>
                                        <input type="text" x-model="albumForm.location" placeholder="e.g. Florence, Italy" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Date</label>
                                        <input type="text" x-model="albumForm.date" placeholder="e.g. Autumn 2024" class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]">
                                    </div>
                                </div>

                                <div class="space-y-2">
                                    <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium">Story Narrative / Description</label>
                                    <textarea rows="3" x-model="albumForm.description" placeholder="Write about the mood, styling, optics used..." class="w-full bg-stone-50 border border-stone-200 p-3 text-sm text-stone-900 focus:outline-none focus:border-[#9E8873]"></textarea>
                                </div>

                                <!-- Hard Drive File Upload Dropzone -->
                                <div class="space-y-3">
                                    <label class="text-[11px] uppercase tracking-wider text-[#9E8873] flex items-center gap-1.5 font-semibold">
                                        <i data-lucide="upload" class="w-3.5 h-3.5"></i> Upload Photos from Hard Drive
                                    </label>
                                    <div @dragover.prevent @dragleave.prevent @drop.prevent="handleDrop($event)"
                                         class="border-2 border-dashed border-stone-200 hover:border-stone-300 bg-stone-50 p-8 text-center transition-all cursor-pointer flex flex-col items-center justify-center space-y-3">
                                        <div class="w-12 h-12 rounded-full bg-white shadow-sm border border-stone-200 flex items-center justify-center text-[#9E8873]">
                                            <i data-lucide="upload" class="w-5 h-5"></i>
                                        </div>
                                        <p class="text-xs text-stone-700 font-sans font-medium">
                                            Drag & drop image files here, or <span class="text-[#9E8873] underline">browse your computer</span>
                                        </p>
                                        <input type="file" multiple accept="image/*" @change="handleFilesSelected($event)" class="hidden" id="hardDriveFileInput">
                                        <label for="hardDriveFileInput" class="bg-stone-800 hover:bg-stone-900 text-white text-xs uppercase px-4 py-2 tracking-wider transition-colors cursor-pointer shadow-sm">Select Files From Hard Drive</label>
                                    </div>
                                </div>

                                <!-- Uploaded Photos preview list with reordering -->
                                <template x-if="albumForm.photos.length > 0">
                                    <div class="space-y-3">
                                        <label class="text-[11px] uppercase tracking-wider text-stone-500 font-medium block" x-text="'Photos in this Album (' + albumForm.photos.length + ') — First photo acts as Cover:'"></label>
                                        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                                            <template x-for="(photo, i) in albumForm.photos" :key="photo.id">
                                                <div class="relative group bg-white border border-stone-200 p-2 space-y-2 shadow-sm">
                                                    <div class="aspect-square overflow-hidden bg-stone-100 relative">
                                                        <img :src="photo.url" class="w-full h-full object-cover">
                                                        <span x-show="i === 0" class="absolute top-1 left-1 bg-[#9E8873] text-white text-[9px] uppercase px-1.5 py-0.5 font-semibold">Cover</span>
                                                    </div>
                                                    
                                                    <!-- Photo Controls: Reorder, Set Cover, Delete -->
                                                    <div class="flex items-center justify-between text-xs pt-1 border-t border-stone-100">
                                                        <div class="flex items-center gap-1">
                                                            <button type="button" @click="movePhoto(i, -1)" :disabled="i === 0" class="p-1 text-stone-500 hover:text-[#9E8873] disabled:opacity-30" title="Move Left">
                                                                <i data-lucide="chevron-left" class="w-3.5 h-3.5"></i>
                                                            </button>
                                                            <button type="button" @click="movePhoto(i, 1)" :disabled="i === albumForm.photos.length - 1" class="p-1 text-stone-500 hover:text-[#9E8873] disabled:opacity-30" title="Move Right">
                                                                <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
                                                            </button>
                                                        </div>
                                                        <div class="flex items-center gap-2">
                                                            <button type="button" x-show="i !== 0" @click="setAsCover(photo.url)" class="text-[9px] text-stone-500 hover:text-[#9E8873] uppercase">Cover</button>
                                                            <button type="button" @click="removePhoto(photo.id)" class="text-rose-500 hover:text-rose-700 p-1" title="Delete Photo">
                                                                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                                                            </button>
                                                        </div>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                                <div class="flex items-center gap-3 pt-2">
                                    <input type="checkbox" id="featuredAlbumToggle" x-model="albumForm.featured" class="w-4 h-4 accent-[#9E8873]">
                                    <label for="featuredAlbumToggle" class="text-xs uppercase tracking-wider text-stone-700 cursor-pointer">Feature this Album in Love Stories Section</label>
                                </div>

                                <div class="flex gap-4 pt-4 border-t border-stone-200">
                                    <button type="submit" class="bg-[#9E8873] text-white px-6 py-3 font-sans text-xs tracking-[0.2em] uppercase font-semibold hover:bg-[#887360] transition-colors shadow-sm" x-text="editingAlbumId ? 'Save Album Changes' : 'Create Album'"></button>
                                    <template x-if="editingAlbumId">
                                        <button type="button" @click="resetAlbumForm()" class="border border-stone-300 text-stone-600 px-6 py-3 text-xs tracking-[0.2em] uppercase hover:text-stone-900">Cancel Edit</button>
                                    </template>
                                </div>
                            </form>
                        </div>

                        <!-- Published Albums list -->
                        <div class="space-y-4 font-sans">
                            <h3 class="text-lg font-serif text-stone-900" x-text="'All Published Albums (' + albums.length + ')'"></h3>
                            <div class="grid grid-cols-1 gap-4">
                                <template x-for="album in albums" :key="album.id">
                                    <div class="bg-white border border-stone-200 p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4 shadow-sm">
                                        <div class="flex items-center gap-4">
                                            <img :src="album.coverUrl || album.photos[0]?.url" class="w-16 h-16 object-cover border border-stone-200 bg-stone-100">
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <h4 class="font-serif text-stone-900 text-base" x-text="album.title"></h4>
                                                    <span class="text-[9px] uppercase px-2 py-0.5 bg-stone-100 text-stone-600 rounded-sm font-medium" x-text="album.category"></span>
                                                    <span class="text-[9px] uppercase px-2 py-0.5 bg-stone-100 text-[#9E8873] rounded-sm flex items-center gap-1 font-medium">
                                                        <i data-lucide="image" class="w-2.5 h-2.5"></i> <span x-text="album.photos.length"></span> photos
                                                    </span>
                                                </div>
                                                <p class="text-xs text-stone-500 line-clamp-1" x-text="album.subtitle || album.location || 'No subtitle'"></p>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-3 self-end md:self-auto">
                                            <button @click="toggleVisibility(album.id)" :class="album.visible ? 'border-stone-300 text-stone-700 hover:bg-stone-100' : 'border-rose-200 text-rose-600 bg-rose-50'" class="p-2 border rounded-sm transition-colors">
                                                <i :data-lucide="album.visible ? 'eye' : 'eye-off'" class="w-4 h-4"></i>
                                            </button>
                                            <button @click="editAlbum(album)" class="p-2 border border-stone-300 text-stone-700 hover:bg-stone-100 rounded-sm transition-colors">
                                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                                            </button>
                                            <button @click="deleteAlbum(album.id)" class="p-2 border border-rose-200 text-rose-600 hover:bg-rose-50 rounded-sm transition-colors">
                                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                                            </button>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
          </div>
        </template>
    </main>

    <!-- Lightbox Modal -->
    <template x-if="lightboxIndex !== null">
        <div class="fixed inset-0 z-50 bg-black/95 backdrop-blur-md flex flex-col justify-between p-4 md:p-8">
            <div class="flex justify-between items-center text-stone-400 text-xs font-sans tracking-widest uppercase">
                <span x-text="(lightboxIndex + 1) + ' / ' + selectedAlbum.photos.length"></span>
                <button @click="lightboxIndex = null" class="p-2 text-stone-400 hover:text-white transition-colors cursor-pointer">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="relative flex-1 flex items-center justify-center my-4 overflow-hidden">
                <button @click="prevLightbox()" class="absolute left-2 md:left-6 z-10 p-3 text-stone-400 hover:text-white bg-black/40 hover:bg-black/70 rounded-full transition-all cursor-pointer">
                    <i data-lucide="chevron-left" class="w-6 h-6"></i>
                </button>
                <img :src="selectedAlbum.photos[lightboxIndex]?.url" class="max-h-[80vh] max-w-[90vw] object-contain shadow-2xl">
                <button @click="nextLightbox()" class="absolute right-2 md:right-6 z-10 p-3 text-stone-400 hover:text-white bg-black/40 hover:bg-black/70 rounded-full transition-all cursor-pointer">
                    <i data-lucide="chevron-right" class="w-6 h-6"></i>
                </button>
            </div>
            <div class="text-center max-w-xl mx-auto space-y-1">
                <p class="text-xs font-sans text-stone-400" x-text="selectedAlbum.photos[lightboxIndex]?.caption || selectedAlbum.title"></p>
            </div>
        </div>
    </template>

    <!-- Footer -->
    <footer class="border-t border-stone-200/80 mt-20 py-12 px-6 md:px-12 text-center text-stone-500 font-sans text-xs space-y-4 bg-white">
        <div class="flex justify-center items-center gap-6 text-stone-600">
            <a href="#" class="hover:text-[#9E8873] transition-colors"><i data-lucide="instagram" class="w-4 h-4"></i></a>
            <a href="#" class="hover:text-[#9E8873] transition-colors"><i data-lucide="mail" class="w-4 h-4"></i></a>
        </div>
        <p class="tracking-widest uppercase text-[10px] text-stone-400">
            © 2026 MARK DENVER LALO. ALL RIGHTS RESERVED.
        </p>
    </footer>

    <!-- Application Script -->
    <script>
        const DEFAULT_ALBUMS = [
            {
                id: 'album-1',
                title: 'Warmth of Tuscany',
                subtitle: 'Val d\'Orcia Wedding Story',
                category: 'Weddings',
                location: 'Tuscany, Italy',
                date: 'Autumn 2024',
                coverUrl: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1600',
                description: 'An intimate sunset celebration tucked away in the rolling golden hills of Val d\'Orcia.',
                visible: true,
                featured: true,
                photos: [
                    { id: 'p1', url: 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1600', caption: 'The bride preparing at Villa Catenignano' },
                    { id: 'p2', url: 'https://images.unsplash.com/photo-1469371670807-013ccf25f16a?auto=format&fit=crop&q=80&w=1600', caption: 'Exchange of vows under Tuscan cypress trees' }
                ]
            },
            {
                id: 'album-2',
                title: 'Monochrome & Texture',
                subtitle: 'Bridal Fashion & Fine Art Portraiture',
                category: 'Editorial',
                location: 'Paris, France',
                date: 'Spring 2025',
                coverUrl: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1600',
                description: 'High fashion editorial capturing silk textures and natural window light.',
                visible: true,
                featured: true,
                photos: [
                    { id: 'p5', url: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=1600', caption: 'Natural light portrait' }
                ]
            }
        ];

        function photographyApp() {
            return {
                albums: [],
                activeTab: 'stories', // Defaults to Featured Stories homepage
                selectedCategory: 'All',
                categories: ['All', 'Weddings', 'Prenup', 'Editorial', 'Portraits'], // Updated category list
                selectedAlbum: null,
                lightboxIndex: null,
                isAdminAuthenticated: false,
                pinInput: '',
                pinError: false,
                editingAlbumId: null,
                albumForm: {
                    title: '',
                    subtitle: '',
                    category: 'Weddings',
                    location: '',
                    date: '',
                    description: '',
                    featured: false,
                    photos: []
                },

                init() {
                    const saved = localStorage.getItem('toto_portfolio_albums');
                    this.albums = saved ? JSON.parse(saved) : DEFAULT_ALBUMS;
                    this.isAdminAuthenticated = localStorage.getItem('toto_admin_auth') === 'true';
                    
                    this.$watch('albums', val => {
                        localStorage.setItem('toto_portfolio_albums', JSON.stringify(val));
                    });

                    // Initialize Lucide icons
                    setTimeout(() => lucide.createIcons(), 50);
                    this.$watch('activeTab', () => setTimeout(() => lucide.createIcons(), 50));
                    this.$watch('selectedAlbum', () => setTimeout(() => lucide.createIcons(), 50));
                    this.$watch('isAdminAuthenticated', () => setTimeout(() => lucide.createIcons(), 50));
                    this.$watch('albumForm.photos', () => setTimeout(() => lucide.createIcons(), 50));
                },

                get visibleAlbums() {
                    return this.albums.filter(a => a.visible && (this.selectedCategory === 'All' || a.category === this.selectedCategory));
                },

                handlePinSubmit() {
                    if (this.pinInput === '1234' || this.pinInput.length >= 4) {
                        this.isAdminAuthenticated = true;
                        localStorage.setItem('toto_admin_auth', 'true');
                        this.pinError = false;
                        this.pinInput = '';
                    } else {
                        this.pinError = true;
                    }
                },

                handleLogoutAdmin() {
                    this.isAdminAuthenticated = false;
                    localStorage.removeItem('toto_admin_auth');
                },

                handleFilesSelected(e) {
                    const files = e.target.files;
                    if (!files || files.length === 0) return;
                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.albumForm.photos.push({
                                id: 'local-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                                url: e.target.result,
                                caption: file.name.replace(/\.[^/.]+$/, "")
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                },

                handleDrop(e) {
                    const files = e.dataTransfer.files;
                    if (!files || files.length === 0) return;
                    Array.from(files).forEach(file => {
                        const reader = new FileReader();
                        reader.onload = (e) => {
                            this.albumForm.photos.push({
                                id: 'local-' + Date.now() + '-' + Math.random().toString(36).substr(2, 5),
                                url: e.target.result,
                                caption: file.name.replace(/\.[^/.]+$/, "")
                            });
                        };
                        reader.readAsDataURL(file);
                    });
                },

                removePhoto(id) {
                    this.albumForm.photos = this.albumForm.photos.filter(p => p.id !== id);
                },

                movePhoto(index, direction) {
                    const newIndex = index + direction;
                    if (newIndex < 0 || newIndex >= this.albumForm.photos.length) return;
                    const item = this.albumForm.photos.splice(index, 1)[0];
                    this.albumForm.photos.splice(newIndex, 0, item);
                },

                setAsCover(url) {
                    const idx = this.albumForm.photos.findIndex(p => p.url === url);
                    if (idx > 0) {
                        const target = this.albumForm.photos.splice(idx, 1)[0];
                        this.albumForm.photos.unshift(target);
                    }
                },

                handleSaveAlbum() {
                    if (!this.albumForm.title) return;
                    const cover = this.albumForm.photos.length > 0 ? this.albumForm.photos[0].url : 'https://images.unsplash.com/photo-1519741497674-611481863552?auto=format&fit=crop&q=80&w=1600';

                    const albumObj = {
                        id: this.editingAlbumId || 'album-' + Date.now(),
                        title: this.albumForm.title,
                        subtitle: this.albumForm.subtitle,
                        category: this.albumForm.category,
                        location: this.albumForm.location,
                        date: this.albumForm.date,
                        description: this.albumForm.description,
                        coverUrl: cover,
                        visible: true,
                        featured: this.albumForm.featured,
                        photos: [...this.albumForm.photos]
                    };

                    if (this.editingAlbumId) {
                        this.albums = this.albums.map(a => a.id === this.editingAlbumId ? albumObj : a);
                        this.editingAlbumId = null;
                    } else {
                        this.albums.unshift(albumObj);
                    }
                    this.resetAlbumForm();
                },

                resetAlbumForm() {
                    this.editingAlbumId = null;
                    this.albumForm = { title: '', subtitle: '', category: 'Weddings', location: '', date: '', description: '', featured: false, photos: [] };
                },

                editAlbum(album) {
                    this.editingAlbumId = album.id;
                    this.albumForm = {
                        title: album.title,
                        subtitle: album.subtitle || '',
                        category: album.category,
                        location: album.location || '',
                        date: album.date || '',
                        description: album.description || '',
                        featured: album.featured || false,
                        photos: [...album.photos]
                    };
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                toggleVisibility(id) {
                    this.albums = this.albums.map(a => a.id === id ? { ...a, visible: !a.visible } : a);
                },

                deleteAlbum(id) {
                    if (confirm('Are you sure you want to delete this album?')) {
                        this.albums = this.albums.filter(a => a.id !== id);
                    }
                },

                openLightbox(idx) {
                    this.lightboxIndex = idx;
                },

                prevLightbox() {
                    if (this.lightboxIndex !== null && this.selectedAlbum) {
                        this.lightboxIndex = (this.lightboxIndex - 1 + this.selectedAlbum.photos.length) % this.selectedAlbum.photos.length;
                    }
                },

                nextLightbox() {
                    if (this.lightboxIndex !== null && this.selectedAlbum) {
                        this.lightboxIndex = (this.lightboxIndex + 1) % this.selectedAlbum.photos.length;
                    }
                }
            }
        }
    </script>
</body>
</html>
